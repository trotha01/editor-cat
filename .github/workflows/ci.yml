name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Mock mode means the whole flow runs with no API keys and no spend.
      - name: Build (mock providers)
        run: npm run build:mock

      - name: Serve and run the end-to-end smoke test
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 &
          npx wait-on http://127.0.0.1:4173 --timeout 60000
          npm run test:e2e
