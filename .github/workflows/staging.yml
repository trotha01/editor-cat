name: Rebuild staging

# `staging` is a disposable integration branch: main, plus every open PR merged
# on top. It is never merged *from* and never incrementally updated — each run
# throws the previous one away and rebuilds from scratch, so a PR that closes,
# lands, or gains a commit is reflected by construction rather than by trying to
# reconcile whatever was there before.
#
# One commit of its own goes on top: `staging-build.json`, saying which PR this
# rebuild was for. The deployed site cannot tell from anything else — see the
# comment on it below — and it exists nowhere but here, which is what keeps the
# badge it feeds off every other deploy of this repository.
#
# Consequence worth knowing: this branch is force-pushed by a bot. Do not commit
# to it or base work on it; anything you put there is gone on the next run.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  # Lets you rebuild by hand after resolving a conflict on a PR branch.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

# One rebuild at a time, newest wins. Cancelling mid-run is safe: every run
# recomputes the whole branch from current state, so the survivor produces the
# same result the cancelled one would have.
concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  integrate:
    # A PR from a fork gets a read-only token, so the push would fail at the
    # very end after doing all the work. Skip those outright.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild staging from main plus every open PR
        env:
          GH_TOKEN: ${{ github.token }}
          # The pull request that set this run off, where one did. Passed as
          # environment rather than interpolated into the script below: a title
          # is arbitrary text written by whoever opened the PR, and `${{ }}`
          # pastes it into the shell before bash ever sees a quote.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          git config user.name "staging-bot"
          git config user.email "staging-bot@users.noreply.github.com"

          # --limit is not optional: gh defaults to 30 and would silently drop
          # every PR past that. Sorted by number so merge order — and therefore
          # which side of a conflict is the one that loses — is reproducible.
          prs="$(gh pr list --state open --base main --limit 200 \
                   --json number -q '.[].number' | sort -n)"

          git checkout -B staging origin/main
          base="$(git rev-parse --short HEAD)"

          merged=""
          skipped=""

          for n in $prs; do
            # Fetched one at a time rather than globbing refs/pull/*: that form
            # pulls down every PR the repo has ever had, closed ones included.
            git fetch --no-tags origin "refs/pull/$n/head:refs/remotes/pr/$n"

            if git merge --no-ff -m "staging: merge PR #$n" "refs/remotes/pr/$n"; then
              merged="$merged $n"
            else
              # `|| true` because aborting a merge that never began is itself an
              # error, and `set -e` would take the whole job down with it.
              git merge --abort || true
              skipped="$skipped $n"
              echo "::warning::PR #$n conflicts with staging and was left out"
            fi
          done

          # What the deployed site puts in its corner: whose work this rebuild
          # was for. Nothing downstream can work this out — every deploy of this
          # branch reports BRANCH=staging and a bot's merge commit, and the one
          # URL they all land on is fixed because Google is holding it — so the
          # answer is written down here, while it is still known, and read back
          # out of the bundle by src/components/StagingBadge.tsx.
          #
          # Named only where the triggering PR is in what is about to be pushed.
          # One that has just closed, or that conflicted and was left out, would
          # otherwise put its name on a build not containing a line of it, which
          # is worse than the build saying nothing about itself at all.
          source_branch="main"
          source_sha="$base"
          pr=""
          title=""
          author=""

          case " $merged " in
            *" ${PR_NUMBER:-none} "*)
              pr="$PR_NUMBER"
              title="$PR_TITLE"
              author="$PR_AUTHOR"
              source_branch="$PR_BRANCH"
              # The PR's own tip rather than the merge commit made for it: this
              # is the number to hold a local `git rev-parse --short HEAD`
              # against, and the merge commit is one no one has ever seen.
              source_sha="$(git rev-parse --short "refs/remotes/pr/$PR_NUMBER")"
              ;;
          esac

          # jq rather than a heredoc, for the same reason the title arrives as
          # environment: every value goes in as an argument and comes out
          # escaped, so no title can end the string it is sitting in.
          jq -n \
            --argjson pr "${pr:-null}" \
            --arg title "$title" \
            --arg author "$author" \
            --arg branch "$source_branch" \
            --arg sha "$source_sha" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{pr: $pr, title: $title, author: $author, branch: $branch,
              sha: $sha, repo: $repo, builtAt: $builtAt}' \
            > staging-build.json

          git add staging-build.json
          git commit -m "staging: name the build"

          git push --force origin staging

          {
            echo "### staging rebuilt"
            echo
            echo "Base: \`main\` @ \`$base\`"
            echo
            if [ -n "$merged" ]; then
              echo "**Merged**"
              for n in $merged; do echo "- #$n"; done
            else
              echo "_No open PRs — staging is a copy of main._"
            fi
            if [ -n "$skipped" ]; then
              echo
              echo "**Skipped (conflicts)**"
              for n in $skipped; do echo "- #$n"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
