# Claude on issues.
#
# Two jobs, because the two events want different postures:
#
#   - A newly opened issue starts work on its own. There is nothing to opt in
#     to yet, and waiting for someone to come back and type "@claude" defeats
#     the point of filing the issue in the first place.
#   - A comment only wakes Claude when it says "@claude". Threads fill up with
#     asides, "thanks", and notes to other people, and a run on each one costs
#     real money to tell you nothing.
#
# Requires, both set up outside this file:
#   - the Claude GitHub App installed on the repository
#     https://github.com/apps/claude
#   - a CLAUDE_CODE_OAUTH_TOKEN repository secret, generated locally with
#     `claude setup-token`. This bills a Claude subscription rather than API
#     credits. To use API credits instead, store ANTHROPIC_API_KEY and swap the
#     `claude_code_oauth_token:` lines below for
#     `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`.
#
#     That token lasts one year and nothing warns you before it lapses: both
#     jobs simply start failing to authenticate, on an event nobody is watching,
#     which reads as Claude having quietly stopped caring about your issues.
#     Renew by running `claude setup-token` again and replacing the secret. The
#     token is printed once and stored nowhere, so copy it there and then.
#     Secret last set: 2026-08 — update this line when you rotate it.
#
# Note the token is a billing choice, not a visibility one: these runs are
# GitHub Actions jobs, so they show up in the workflow log and as issue and PR
# comments. They are not Claude Code cloud sessions and do not appear in the
# session list at claude.ai/code or in the desktop and mobile apps.
#
# GitHub reads `issues` and `issue_comment` workflows from the default branch,
# so this does nothing until it is merged to main.
name: Claude

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

# One run per issue. A quick follow-up comment should not race the run still
# working on the comment before it, both pushing to the same branch.
concurrency:
  group: claude-${{ github.event.issue.number }}
  cancel-in-progress: false

# The action allows file edits, read-only git and commenting out of the box,
# and nothing else: "Claude does not have access to execute arbitrary Bash
# commands by default." Everything the prompt below asks for past editing a
# file — cut a branch, npm ci, run the tests, commit, push, open the PR — is a
# Bash call, so without this list a run burns its turns collecting permission
# denials and then exits 0 having done nothing. These add to the built-in
# GitHub tools rather than replacing them.
env:
  CLAUDE_TOOLS: "Edit,Write,Read,Glob,Grep,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git:*),Bash(gh:*)"

  # 60 turns ran out after ten and a half minutes on the first issue that got
  # far enough to try: 61 turns, 629s, which is a shade over 10s a turn. A
  # front-end change with tests in it is simply longer than 60 turns. At that
  # observed rate 200 turns is a little over half an hour, which puts the wall
  # clock rather than the turn counter in charge of when a run ends — see the
  # step timeouts below.
  CLAUDE_MAX_TURNS: "200"

jobs:
  # --- A new issue: start without being asked -------------------------------
  new-issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    # Deliberately longer than the 35 minutes the Claude step below is allowed.
    # If the job hits its own timeout GitHub cancels it outright and the comment
    # posted at the start is left saying "working on it" for ever. Letting the
    # step time out first keeps the job alive to go and correct that comment.
    timeout-minutes: 40
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Required for the action's default GitHub App authentication.
      id-token: write
      # Lets Claude read CI results.
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Say so in the thread before the work starts. The run is already visible
      # in the Actions tab, but nobody watches the Actions tab — the issue is
      # where you are looking right after you file one. Automation mode posts
      # nothing of its own until it has a result, and a run that dies early
      # posts nothing at all, which reads exactly like never having started.
      #
      # The `mention` job below needs no equivalent: interactive mode opens its
      # own tracking comment as soon as it wakes up.
      - name: Say Claude picked it up
        id: ack
        uses: actions/github-script@v9
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const { data } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🐱 Claude picked this up and is working on it — [watch the run](${run}).\n\nThis comment is updated when the run finishes.`,
            })
            core.setOutput('id', data.id)

      - uses: anthropics/claude-code-action@v1
        id: claude
        timeout-minutes: 35
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # A prompt puts the action in automation mode: it runs on the event
          # itself rather than waiting to be mentioned.
          prompt: |
            Issue #${{ github.event.issue.number }} was just opened on this repository. Implement it.

            This is a React 19 + TypeScript + Vite video editor that runs in the browser.
            Source is under src/components, src/hooks and src/lib, with Netlify functions in
            netlify/functions. Tests are vitest, colocated as *.test.ts(x).

            Read the issue first, then read enough of the codebase to understand how the area
            you are changing actually works. Do not start editing from the issue title alone.

            If the ask is genuinely ambiguous — several readings would produce materially
            different code — do not guess. Post one comment on the issue asking the specific
            question, and stop there without writing code. Someone will reply and mention
            @claude, which starts a fresh run with their answer.

            Otherwise:
              - Work on a branch named claude/issue-${{ github.event.issue.number }}-<short-slug>, cut from main.
                Push it as soon as there is one commit on it and keep pushing as you go, rather
                than saving it all for the end. A run that stops early — turn limit, timeout —
                leaves behind exactly what it has pushed and nothing else, and there is no way
                to resume the session afterwards. A pushed branch is the only thing anyone,
                including a later run, can pick the work up from.
              - Match the surrounding code's idiom, naming and comment density. This codebase
                explains *why* in its comments; follow that.
              - Add or update tests where the repo already covers that area. Where practical,
                check that a new test fails without your change — a test that passes either
                way proves nothing.
              - Verify with: npm ci, npm run typecheck, npm run lint, npm run format:check, npm test
              - Commit, push the branch, and open a pull request against main whose body links
                the issue with "Closes #${{ github.event.issue.number }}".
              - Comment on the issue linking the PR and saying briefly what you built.

            Report failures honestly. If part of the issue is blocked or you left something
            out, say so plainly in the PR body rather than quietly narrowing the scope.
          claude_args: |
            --max-turns ${{ env.CLAUDE_MAX_TURNS }}
            --allowedTools "${{ env.CLAUDE_TOOLS }}"

      # The step above exits 0 whether or not it built anything — a run that
      # spends every turn being denied permission still "succeeds". So close
      # the loop by pointing at the evidence instead of claiming a result.
      - name: Report how the run went
        if: always()
        uses: actions/github-script@v9
        env:
          OUTCOME: ${{ steps.claude.outcome }}
          COMMENT_ID: ${{ steps.ack.outputs.id }}
        with:
          script: |
            const id = Number(process.env.COMMENT_ID)
            if (!id) return
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = process.env.OUTCOME === 'success'
              ? `🐱 Claude's run [finished](${run}).\n\nIf no pull request is linked above, it did not manage to open one — the [log](${run}) says why.`
              : `🐱 Claude's run [failed or was cancelled](${run}), so this issue was not picked up. The [log](${run}) has the details.`
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: id,
              body,
            })

  # --- A comment: only when asked -------------------------------------------
  mention:
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    # Same 40/35 split as above. Interactive mode keeps its own comment up to
    # date, so a step that times out here reports itself; the job only needs
    # the headroom to let that happen.
    timeout-minutes: 40
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # No prompt, so the action runs in interactive mode: it reads the comment
      # that mentioned it and replies in the thread as it works.
      - uses: anthropics/claude-code-action@v1
        timeout-minutes: 35
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns ${{ env.CLAUDE_MAX_TURNS }}
            --allowedTools "${{ env.CLAUDE_TOOLS }}"
