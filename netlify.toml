[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Single-page app: every non-file, non-API route serves the shell.
# Functions declare their own paths via `export const config`, and those take
# precedence over this catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Microphone is required for voiceover recording; nothing else is.
    Permissions-Policy = "camera=(), geolocation=(), microphone=(self)"
    # 'wasm-unsafe-eval' is required by ffmpeg.wasm. blob: covers the worker,
    # the object URLs used for media, and the export download.
    # 'wasm-unsafe-eval' is required by ffmpeg.wasm. blob: covers the worker,
    # the object URLs used for media, and the export download.
    # accounts.google.com serves the Google Identity Services client, which
    # also needs frame-src for the hidden iframe it uses to renew tokens
    # without a pop-up.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: https://accounts.google.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' data: blob: https:; font-src 'self' data:; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
